<div class="parametros-globales">
  <h2>Parámetros globales</h2>

  <div class="form-group">
    <label for="titulo">Título del estudio</label>
    <input
      id="titulo"
      type="text"
      [(ngModel)]="estudio.titulo"
      placeholder="Ej: Armario dormitorio principal"
    />
  </div>

  <h3>Dimensiones (mm)</h3>

  <div class="form-row">
    <div class="form-group">
      <label for="altura">Altura</label>
      <input
        id="altura"
        type="number"
        [(ngModel)]="estudio.dimensiones.altura"
        placeholder="0"
      />
    </div>

    <div class="form-group">
      <label for="anchura">Anchura</label>
      <input
        id="anchura"
        type="number"
        [(ngModel)]="estudio.dimensiones.anchura"
        placeholder="0"
      />
    </div>

    <div class="form-group">
      <label for="profundidad">Profundidad</label>
      <input
        id="profundidad"
        type="number"
        [(ngModel)]="estudio.dimensiones.profundidad"
        placeholder="0"
      />
    </div>
  </div>
</div>
